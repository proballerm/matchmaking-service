[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchmaking-service"
version = "0.1.0"
description = "Skill-based matchmaking service"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }
