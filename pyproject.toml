[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchmaking-service"
version = "0.10.0"
description = "Skill-based matchmaking service"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "redis>=5.0,<7.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "fakeredis[lua]>=2.23,<3.0",
  "locust>=2.29,<3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }
