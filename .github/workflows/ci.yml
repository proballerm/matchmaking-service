name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  benchmark-smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379/0
      REDIS_NAMESPACE: ci-matchmaking
      ENABLE_BACKGROUND_TICK: "1"
      TICK_INTERVAL_SECONDS: "0.1"
      LOADTEST_MAX_FAILURE_RATE: "0.01"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and benchmark dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Start API
        run: |
          uvicorn api.app:app --host 127.0.0.1 --port 8000 > /tmp/matchmaking-api.log 2>&1 &
          echo $! > /tmp/matchmaking-api.pid

      - name: Wait for API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/matchmaking-api.log
          exit 1

      - name: Run Locust smoke test
        run: |
          mkdir -p benchmark/results
          locust \
            -f loadtest/locustfile.py \
            --headless \
            --host http://127.0.0.1:8000 \
            --users 10 \
            --spawn-rate 10 \
            --run-time 15s \
            --csv benchmark/results/ci-smoke \
            --html benchmark/results/ci-smoke.html

      - name: Summarize smoke-test results
        run: |
          python loadtest/summarize_results.py \
            benchmark/results/ci-smoke_stats.csv \
            benchmark/results/ci-smoke_summary.json
          cat benchmark/results/ci-smoke_summary.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-results
          path: |
            benchmark/results/ci-smoke*.csv
            benchmark/results/ci-smoke*.html
            benchmark/results/ci-smoke*.json
            /tmp/matchmaking-api.log
          if-no-files-found: warn
          retention-days: 14
